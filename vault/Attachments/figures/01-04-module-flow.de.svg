<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 388" width="390" height="388" role="img" aria-labelledby="fig-01-04-module-flow-de-title fig-01-04-module-flow-de-desc" font-size="13" fill="var(--ink)"><title id="fig-01-04-module-flow-de-title">Drei Module, eine Pipeline</title><desc id="fig-01-04-module-flow-de-desc">Drei Module laufen nacheinander, und jedes endet in einer eigenen Prüfung. Wählerdatensatz 50.000 synthetische Einträge speist Modul A Segmentierung, Wahlbeteiligung Prüfung: Silhouette, ARI, Brier. 2.772 Zeilen, 6 Mio. USD speist Modul B Allokation (MILP) Prüfung: Solver-Vergleich. Acht veröffentlichte Umfragen und das verifizierte Ergebnis speist Modul C Umfrage-Tracking Prüfung: zurück- gehaltene Umfragen.</desc><defs><marker id="fig-01-04-module-flow-de-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="var(--ink-2)"/></marker></defs><line x1="180" y1="50" x2="212" y2="50" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-de-arrow)"/><rect x="0" y="18" width="180" height="64" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="10" y="38.5" font-weight="600">Wählerdatensatz</text><text x="10" y="54.5">50.000 synthetische</text><text x="10" y="70.5">Einträge</text><rect x="214" y="0" width="176" height="100" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="224" y="22.5" font-weight="600">Modul A</text><text x="224" y="38.5">Segmentierung,</text><text x="224" y="54.5" fill="var(--ink-2)">Wahlbeteiligung</text><text x="224" y="70.5" fill="var(--ink-2)">Prüfung: Silhouette,</text><text x="224" y="86.5" fill="var(--ink-2)">ARI, Brier</text><line x1="302" y1="100" x2="302" y2="142" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-de-arrow)"/><text x="292" y="126.5" text-anchor="end" fill="var(--ink-2)">Übergabe</text><line x1="180" y1="194" x2="212" y2="194" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-de-arrow)"/><rect x="0" y="162" width="180" height="64" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="10" y="190.5" font-weight="600">2.772 Zeilen,</text><text x="10" y="206.5">6 Mio. USD</text><rect x="214" y="144" width="176" height="100" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="224" y="174.5" font-weight="600">Modul B</text><text x="224" y="190.5">Allokation (MILP)</text><text x="224" y="206.5" fill="var(--ink-2)">Prüfung:</text><text x="224" y="222.5" fill="var(--ink-2)">Solver-Vergleich</text><line x1="302" y1="244" x2="302" y2="286" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-de-arrow)"/><text x="292" y="270.5" text-anchor="end" fill="var(--ink-2)">Übergabe</text><line x1="180" y1="338" x2="212" y2="338" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-de-arrow)"/><rect x="0" y="306" width="180" height="64" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="10" y="326.5" font-weight="600">Acht veröffentlichte</text><text x="10" y="342.5">Umfragen und das</text><text x="10" y="358.5">verifizierte Ergebnis</text><rect x="214" y="288" width="176" height="100" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="224" y="318.5" font-weight="600">Modul C</text><text x="224" y="334.5">Umfrage-Tracking</text><text x="224" y="350.5" fill="var(--ink-2)">Prüfung: zurück-</text><text x="224" y="366.5" fill="var(--ink-2)">gehaltene Umfragen</text></svg>
