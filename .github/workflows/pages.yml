# Build, verify and publish the site with GitHub Pages (DEPLOY.md).
# One-time setup: Settings → Pages → Source: GitHub Actions.
# The site is served at the custom domain rafaelbragakribitz.com
# (public/CNAME), so it is built at the root: SITE_BASE is '/' here and the
# repository variable of the old project-site deploy is ignored.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # scheduled publishing (owner, 23 Oct 2026): a note dated in the future
  # is left out of the build; a daily build puts it online on its date
  schedule:
    - cron: '43 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a running one is allowed to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the gates
        run: npx playwright install --with-deps chromium

      # the project build logs read each repository's git history
      # (scripts/activity/snapshot.mjs); if that fails, the committed
      # src/data/activity.json is built instead
      - name: Refresh the build logs
        run: npm run activity
        continue-on-error: true

      # astro check, lint, unit tests, the build (with SITE_BASE) and every
      # gate over dist/ (the gate runner reads SITE_BASE as its --base)
      - name: Verify
        run: npm run verify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
