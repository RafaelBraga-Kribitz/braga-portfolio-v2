<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" width="360" height="388" role="img" aria-labelledby="fig-01-04-module-flow-en-title fig-01-04-module-flow-en-desc" font-size="13" fill="var(--ink)"><title id="fig-01-04-module-flow-en-title">Three modules, one pipeline</title><desc id="fig-01-04-module-flow-en-desc">Three modules run in order, and each ends in its own check. Voter file, 50,000 synthetic records feeds Module A Segmentation, turnout Check: silhouette, ARI, Brier. 2,772 rows and USD 6 million feed Module B Allocation (MILP) Check: solver comparison. Eight published polls and the verified outcome feed Module C Poll tracking Check: held-out polls.</desc><defs><marker id="fig-01-04-module-flow-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="var(--ink-2)"/></marker></defs><line x1="150" y1="50" x2="182" y2="50" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-en-arrow)"/><rect x="0" y="18" width="150" height="64" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="10" y="38.5" font-weight="600">Voter file</text><text x="10" y="54.5">50,000 synthetic</text><text x="10" y="70.5">records</text><rect x="184" y="0" width="176" height="100" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="194" y="30.5" font-weight="600">Module A</text><text x="194" y="46.5">Segmentation, turnout</text><text x="194" y="62.5" fill="var(--ink-2)">Check: silhouette,</text><text x="194" y="78.5" fill="var(--ink-2)">ARI, Brier</text><line x1="272" y1="100" x2="272" y2="142" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-en-arrow)"/><text x="262" y="126.5" text-anchor="end" fill="var(--ink-2)">Handoff</text><line x1="150" y1="194" x2="182" y2="194" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-en-arrow)"/><rect x="0" y="162" width="150" height="64" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="10" y="190.5" font-weight="600">2,772 rows,</text><text x="10" y="206.5">USD 6 million</text><rect x="184" y="144" width="176" height="100" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="194" y="174.5" font-weight="600">Module B</text><text x="194" y="190.5">Allocation (MILP)</text><text x="194" y="206.5" fill="var(--ink-2)">Check: solver</text><text x="194" y="222.5" fill="var(--ink-2)">comparison</text><line x1="272" y1="244" x2="272" y2="286" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-en-arrow)"/><text x="262" y="270.5" text-anchor="end" fill="var(--ink-2)">Handoff</text><line x1="150" y1="338" x2="182" y2="338" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#fig-01-04-module-flow-en-arrow)"/><rect x="0" y="306" width="150" height="64" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="10" y="326.5" font-weight="600">Eight published</text><text x="10" y="342.5">polls and the</text><text x="10" y="358.5">verified outcome</text><rect x="184" y="288" width="176" height="100" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="1.5"/><text x="194" y="318.5" font-weight="600">Module C</text><text x="194" y="334.5">Poll tracking</text><text x="194" y="350.5" fill="var(--ink-2)">Check: held-out</text><text x="194" y="366.5" fill="var(--ink-2)">polls</text></svg>
