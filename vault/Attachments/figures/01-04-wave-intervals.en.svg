<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-labelledby="fig-01-04-wave-intervals-en-title fig-01-04-wave-intervals-en-desc" font-size="13" fill="var(--ink)"><title id="fig-01-04-wave-intervals-en-title">Held-out polls against the 95% band</title><desc id="fig-01-04-wave-intervals-en-desc">The 95% band caught 4 of 6 held-out polls. A calibrated band would catch about 6. Per held-out wave: observed margin, predictive mean and 95% interval, in percentage points. 15 Mar: Observed margin −4.50, Predictive mean 20.27, 95% band −3.2 to 44.7, miss. 18 Mar: Observed margin 31.40, Predictive mean 3.97, 95% band −14.9 to 22.7, miss. 26 Mar: Observed margin 26.43, Predictive mean 14.68, 95% band −7.6 to 34.6, caught. 6 Apr: Observed margin 31.50, Predictive mean 21.53, 95% band −4.1 to 46.3, caught. 10 Apr: Observed margin 25.11, Predictive mean 22.75, 95% band 0.5 to 44.2, caught. 18 Apr: Observed margin −5.12, Predictive mean 17.18, 95% band −5.9 to 38.3, caught.</desc><line x1="70" y1="12" x2="70" y2="252" stroke="var(--rule-c)" stroke-width="1"/><text x="70" y="272" text-anchor="middle" fill="var(--ink-2)">−20</text><line x1="135" y1="12" x2="135" y2="252" stroke="var(--ink-2)" stroke-width="1"/><text x="135" y="272" text-anchor="middle" fill="var(--ink-2)">0</text><line x1="200" y1="12" x2="200" y2="252" stroke="var(--rule-c)" stroke-width="1"/><text x="200" y="272" text-anchor="middle" fill="var(--ink-2)">20</text><line x1="265" y1="12" x2="265" y2="252" stroke="var(--rule-c)" stroke-width="1"/><text x="265" y="272" text-anchor="middle" fill="var(--ink-2)">40</text><line x1="330" y1="12" x2="330" y2="252" stroke="var(--rule-c)" stroke-width="1"/><text x="330" y="272" text-anchor="middle" fill="var(--ink-2)">60</text><line x1="70" y1="252" x2="330" y2="252" stroke="var(--ink-2)" stroke-width="1"/><text x="70" y="294" fill="var(--ink-2)">Margin in percentage points (pp)</text><text x="0" y="36.5" font-weight="600">1