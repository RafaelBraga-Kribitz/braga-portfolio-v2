# Tools registry (DATA-03) — the single source of truth read by both
# the home page's Tools section and `/tools` via getToolsData(). Only
# `status: live` entries render in either listing (see
# src/lib/schemas/tools.schema.ts).
#
# Thirteen entries: the confusion matrix, already shipping, plus the
# twelve tool ports scheduled for Phases 4 and 5 (REQUIREMENTS.md
# TOOL-08 through TOOL-19 — the eight light ports, then the four heavy
# simulators, in that order). Codes are assigned once and are stable;
# the confusion matrix keeps the code it ships with today.
#
# The twelve unbuilt entries carry `[Placeholder]` summaries — the
# bracket-prefixed marker src/lib/validate.ts's collectPlaceholders
# walk enumerates — rather than invented finished copy. Those
# summaries never render today, because only live entries are listed;
# the copy phase (Phase 6) replaces them as each tool ships and its
# status flips to live.

tools:
  - code: "04-01"
    family: experiments
    title: Confusion Matrix
    href: /tools/confusion-matrix
    summary: "Interactive classifier diagnostics — eight metrics, population flow, and a business cost calculator."
    note: "Move the decision threshold and watch eight metrics move with it, then attach a cost to each error type and see where the trade-off actually lands."
    status: live

  # --- Light ports (TOOL-08 – TOOL-15) ---
  - code: "04-02"
    family: measurement
    title: Attribution Models
    href: /tools/attribution-models
    summary: "Six models reallocate one conversion across a journey. Linear E-comm: €100 per touch."
    note: "Last-click funds the last ad. Linear splits €500 five ways. The model choice moves budget, not the path."
    status: live
  - code: "04-03"
    family: experiments
    title: A/B Testing
    href: /tools/ab-testing
    summary: "Landing: control 5.0%, variant 5.75% at +15% lift. Simulation runs only on Simulate 200."
    note: "Two-proportion z-test. Simulate 200 draws binomial z-scores on click; first paint is empty stems."
    status: live
  - code: "04-04"
    family: experiments
    title: Power Analysis
    href: /tools/power-analysis
    summary: "Two-sample power. A/B CVR defaults: Δ=5, σ=20, n=100 → Cohen's d = 0.25."
    note: "Power is a number, not a gauge. n at 80% and 90% sit on MetricGrid."
    status: live
  - code: "04-05"
    family: experiments
    title: Confidence Intervals
    href: /tools/confidence-intervals
    summary: "Coverage of μ. Defaults n=30, 95%, σ=40, μ=120 → z* = 1.96. Forest empty until Draw 40."
    note: "Each interval is one ScatterChart series, two points connected. Conversion-rate μ/σ use fractional domains."
    status: live
  - code: "04-06"
    family: experiments
    title: Type I / Type II Errors
    href: /tools/type-1-type-2-errors
    summary: "A/B preset: α = 5.0%, d = 0.5, n = 100, one-tailed. Expected 2×2 uses N = 1,000. No quiz."
    note: "α and β from Φ in stats.ts. Tails is a ScenarioSelector. Expected counts assume N = 1,000 at a 50% base rate."
    status: live
  - code: "04-07"
    family: traps
    title: Simpson's Paradox
    href: /tools/simpsons-paradox
    summary: "Segment rates can reverse in the aggregate. Channel CVR: Google 36.4% overall, Meta 28.9%."
    note: "Google 81/270 and 192/480 vs Meta 234/780 and 55/220. The mix, not the channel, moves the overall rate."
    status: live
  - code: "04-08"
    family: traps
    title: Base-Rate Fallacy
    href: /tools/base-rate-fallacy
    summary: "A 90% sensitive fraud model at 0.5% base rate is right 8.3% of the time it flags. Per 10,000: 45 TP, 498 FP."
    note: "Posterior = (sens × base) / (sens × base + fpr × (1 − base)). Fraud defaults: 45 true positives, 498 false alarms."
    status: live
  - code: "04-09"
    family: traps
    title: Sampling Bias
    href: /tools/sampling-bias
    summary: "Survey preset: μ = 50, σ = 15, n = 200. Densities and error cloud empty until Resample."
    note: "Resample is click-only. Dist and bias direction are ScenarioSelectors. No quiz."
    status: live

  # --- Heavy simulators (TOOL-16 – TOOL-19) ---
  - code: "04-10"
    family: measurement
    title: Media-Mix Model Simulator
    href: /tools/mmm-simulator
    summary: "E-comm: Google spend €20,000. Blended ROAS 7.29x at €43,000 total media. Auto-optimise is click-only."
    note: "Hill curves; no canvas. URL restores spend. No quiz."
    status: live
  - code: "04-11"
    family: measurement
    title: CAC / LTV Simulator
    href: /tools/cac-ltv-simulator
    summary: "B2B SaaS: CAC €450. Discounted LTV €1,049; LTV/CAC 2.33x; payback 8 months."
    note: "Finite-horizon discounted LTV. No canvas. URL restores params. No quiz."
    status: live
  - code: "04-12"
    family: measurement
    title: Cohort Retention Simulator
    href: /tools/cohort-retention-simulator
    summary: "Baseline: decay 0.85, ARPU €29. Oldest cohort Month 1 retention is 45%."
    note: "HeatmapChart sequential orange. No tabs, no HTML table, no scale picker."
    status: live
  - code: "04-13"
    family: measurement
    title: Funnel Analysis Simulator
    href: /tools/funnel-analysis-simulator
    summary: "E-comm overall conversion is 4.37% — product of five stage rates on 10,000 visits."
    note: "FunnelChart live consumer. No new chart file. URL restores rates. No quiz."
    status: live

  # --- Query semantics ---
  - code: "04-14"
    family: sql
    title: SQL Joins
    href: /tools/sql-joins
    summary: "Five join types over one pair of tables. Customers × Orders: 5 and 5 rows in, INNER JOIN returns 4."
    note: "The join type decides which keys survive; duplicate keys decide how many rows each surviving key carries. Both are silent, and both move the number on the dashboard."
    status: live
  - code: "04-15"
    family: sql
    title: Group By
    href: /tools/group-by
    summary: "Aggregation changes the grain. Orders: 12 rows become 3 regions, and HAVING removes groups silently."
    note: "After an aggregate the row count counts groups, not orders. HAVING then removes groups without touching a single source row — the filter that runs after the answer is computed."
    status: live

  # --- Diagnosis ---
  - code: "04-16"
    family: measurement
    title: Funnel Diagnosis
    href: /tools/funnel-diagnostics
    summary: "Fifteen faults in one B2B funnel, each read in leverage order: gates first, then TOF, MOF and BOF."
    note: "A dashboard that reads its own numbers. The verdict says where to act first; the rail says why, what to check and what not to touch; the essay around it explains every number on it."
    status: live
