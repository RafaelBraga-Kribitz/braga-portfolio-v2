<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-labelledby="fig-01-04-wave-intervals-de-title fig-01-04-wave-intervals-de-desc" font-size="13" fill="var(--ink)"><title id="fig-01-04-wave-intervals-de-title">Zurückgehaltene Umfragen gegenüber dem Band zu 95 %</title><desc id="fig-01-04-wave-intervals-de-desc">Das Band zu 95 % erfasste 3 von 6 zurückgehaltenen Umfragen. Ein kalibriertes Band würde etwa 6 erfassen. Je zurückgehaltener Welle: beobachteter Abstand, Prognosemittel und Intervall zu 95 %, in Prozentpunkten. 15. März: Beobachteter Abstand −4,50, Prognosemittel 19,40, Band zu 95 % −1,2 bis 42,9, verfehlt. 18. März: Beobachteter Abstand 31,40, Prognosemittel 4,81, Band zu 95 % −13,2 bis 22,8, verfehlt. 26. März: Beobachteter Abstand 26,43, Prognosemittel 13,78, Band zu 95 % −2,8 bis 29,7, erfasst. 6. Apr.: Beobachteter Abstand 31,50, Prognosemittel 20,70, Band zu 95 % −3,4 bis 51,9, erfasst. 10. Apr.: Beobachteter Abstand 25,11, Prognosemittel 23,85, Band zu 95 % 6,6 bis 45,0, erfasst. 18. Apr.: Beobachteter Abstand −5,12, Prognosemittel 14,82, Band zu 95 % −3,6 bis 38,4, verfehlt.</desc><line x1="70" y1="12" x2="70" y2="252" stroke="var(--rule-c)" stroke-width="1"/><text x="70" y="272" text-anchor="middle" fill="var(--ink-2)">−20</text><line x1="135" y1="12" x2="135" y2="252" stroke="var(--ink-2)" stroke-width="1"/><text x="135" y="272" text-anchor="middle" fill="var(--ink-2)">0</text><line x1="200" y1="12" x2="200" y2="252" stroke="var(--rule-c)" stroke-width="1"/><text x="200" y="272" text-anchor="middle" fill="var(--ink-2)">20</text><line x1="265" y1="12" x2="265" y2="252" stroke="var(--rule-c)" stroke-width="1"/><text x="265" y="272" text-anchor="middle" fill="var(--ink-2)">40</text><line x1="330" y1="12" x2="330" y2="252" stroke="var(--rule-c)" stroke-width="1"/><text x="330" y="272" text-anchor="middle" fill="var(--ink-2)">60</text><line x1="70" y1="252" x2="330" y2="252" stroke="var(--ink-2)" strok