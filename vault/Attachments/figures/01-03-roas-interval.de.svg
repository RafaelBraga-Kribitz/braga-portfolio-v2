<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 348" width="480" height="348" role="img" aria-labelledby="fig-01-03-roas-interval-de-title fig-01-03-roas-interval-de-desc" font-size="13" fill="var(--ink)"><title id="fig-01-03-roas-interval-de-title">Marginaler ROAS je Kanal, mit Intervall zu 90 %</title><desc id="fig-01-03-roas-interval-de-desc">TV liegt bei beiden Prior-Sätzen über der Linie von 2,50. Facebook liegt nur bei den berichteten Priors darüber. Print und Search kreuzen die Linie, und die Außenwerbung bleibt darunter. Median und Intervall zu 90 % des marginalen ROAS bei den derzeitigen Ausgaben; der Breakeven liegt bei 2,50. TV 7,26 (4,38–10,72); Facebook 20,53 (4,76–45,52); Print 7,81 (1,22–16,01); Search 7,68 (0,89–25,55); Außenwerbung 0,75 (0,10–1,68).</desc><line x1="126.68" y1="48" x2="126.68" y2="288" stroke="var(--rule-c)" stroke-width="1"/><text x="126.68" y="308" text-anchor="middle" fill="var(--ink-2)">0,1</text><line x1="202.01" y1="48" x2="202.01" y2="288" stroke="var(--rule-c)" stroke-width="1"/><text x="202.01" y="308" text-anchor="middle" fill="var(--ink-2)">1</text><line x1="231.99" y1="48" x2="231.99" y2="288" stroke="var(--rule-c)" stroke-width="1"/><text x="231.99" y="308" text-anchor="middle" fill="var(--ink-2)">2,5</text><line x1="277.34" y1="48" x2="277.34" y2="288" stroke="var(--rule-c)" stroke-width="1"/><text x="277.34" y="308" text-anchor="middle" fill="var(--ink-2)">10</text><line x1="330" y1="48" x2="330" y2="288" stroke="var(--rule-c)" stroke-width="1"/><text x="330" y="308" text-anchor="middle" fill="var(--ink-2)">50</text><line x1="104" y1="288" x2="330" y2="288" stroke="var(--ink-2)" stroke-width="1"/><text x="0" y="334" fill="var(--ink-2)">Marginaler ROAS bei derzeitigen Ausgaben, logarithmisch</text><text x="0" y="85.5" font-weight="600">TV</text><line x1="250.34" y1="81" x2="279.62" y2="81" stroke="var(--ink)" stroke-width="2"/><line x1="250.34" y1="75" x2="250.34" y2="87" stroke="var(--ink)" stroke-width="2"/><